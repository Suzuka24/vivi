<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}}; script-src 'nonce-{{nonce}}';"><link rel="stylesheet" href="{{style}}"></head>
<body class="explorer">
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="i-up" viewBox="0 0 20 20"><path d="M3 4h5l2 2h7v10H3zM10 13V8m-3 3 3-3 3 3"/></symbol><symbol id="i-home" viewBox="0 0 20 20"><path d="m2.5 9 7.5-6 7.5 6M5 8v9h10V8M8 17v-5h4v5"/></symbol><symbol id="i-refresh" viewBox="0 0 20 20"><path d="M16 7a6.5 6.5 0 1 0 1 5M16 3v4h-4"/></symbol><symbol id="i-folder-plus" viewBox="0 0 20 20"><path d="M2 5h6l2 2h8v10H2zM10 10v5m-2.5-2.5h5"/></symbol><symbol id="i-file-plus" viewBox="0 0 20 20"><path d="M4 2h8l4 4v12H4zM12 2v4h4M10 9v6m-3-3h6"/></symbol><symbol id="i-trash" viewBox="0 0 20 20"><path d="M3 5h14M7 5V3h6v2M5 5l1 12h8l1-12M8 8v6m4-6v6"/></symbol><symbol id="i-hidden" viewBox="0 0 20 20"><path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><circle cx="10" cy="10" r="2"/></symbol><symbol id="i-terminal" viewBox="0 0 20 20"><path d="M2 4h16v12H2zM5 7l3 3-3 3m5 0h5"/></symbol><symbol id="i-sort" viewBox="0 0 20 20"><path d="M4 5h9M4 10h7M4 15h5m6-10 2-2 2 2m-2-2v12m-2-2 2 2 2-2"/></symbol><symbol id="i-go" viewBox="0 0 20 20"><path d="M3 10h13m-5-5 5 5-5 5"/></symbol></svg>
<div class="explorer-tools" role="toolbar" aria-label="File navigation"><button id="up" class="icon-button" title="Parent folder" aria-label="Parent folder"><svg><use href="#i-up"/></svg></button><button id="home" class="icon-button" title="Home folder" aria-label="Home folder"><svg><use href="#i-home"/></svg></button><button id="refresh" class="icon-button" title="Refresh folder" aria-label="Refresh folder"><svg><use href="#i-refresh"/></svg></button><span class="tool-separator"></span><button id="newFolder" class="icon-button" title="New folder" aria-label="New folder"><svg><use href="#i-folder-plus"/></svg></button><button id="newFile" class="icon-button" title="New file" aria-label="New file"><svg><use href="#i-file-plus"/></svg></button><button id="delete" class="icon-button" title="Move selected item to Trash" aria-label="Move selected item to Trash" disabled><svg><use href="#i-trash"/></svg></button><span class="tool-separator"></span><button id="hidden" class="icon-button selected" title="Hide hidden files" aria-label="Hide hidden files" aria-pressed="true"><svg><use href="#i-hidden"/></svg></button><button id="terminal" class="icon-button" title="Insert selected path into terminal" aria-label="Insert selected path into terminal" disabled><svg><use href="#i-terminal"/></svg></button><button id="sort" class="icon-button" title="Sort files" aria-label="Sort files" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-sort"/></svg></button></div>
<form id="navigate"><div class="path-combo"><input id="path" placeholder="/path/to/data" aria-label="Directory path" autocomplete="off"><button id="pathHistory" type="button" title="Recent paths" aria-label="Recent paths" aria-haspopup="listbox" aria-expanded="false" disabled>▾</button><div id="historyMenu" role="listbox" aria-label="Recent paths" hidden></div></div><button class="icon-button go-button" title="Go to path" aria-label="Go to path"><svg><use href="#i-go"/></svg></button></form>
<input id="filter" placeholder="Filter files…" aria-label="Filter files"><div id="error" role="alert"></div><div id="files" role="list"></div>
<footer><button id="prev" title="Previous page">‹</button><span id="page"></span><button id="next" title="Next page">›</button></footer>
<details id="layoutModule" class="side-module" open><summary>LAYOUT <span id="layoutTitle"></span></summary><div class="side-module-body">
<div id="layoutEmpty" class="muted">Open an image to arrange frames.</div>
<div id="layoutControls" hidden>
<select id="layoutDataset" aria-label="Dataset"></select>
<div class="slice-controls"><button id="slicePrev" title="Previous slice; hold to play backward">‹</button><input id="sliceRange" type="range" min="1" max="1" value="1" aria-label="Slice position"><button id="sliceNext" title="Next slice; hold to play forward">›</button></div>
<div class="slice-controls"><input id="sliceNumber" type="number" min="1" value="1" aria-label="Slice number"><span id="sliceTotal">/ 1</span><button id="slicePlay" title="Play or pause slices">▶</button><label>FPS <input id="sliceFps" type="number" min="1" max="30" value="5"></label></div>
<div class="frame-heading"><span>Frames</span><button id="framePrevious" title="Previous file frame">‹</button><button id="frameNext" title="Next file frame">›</button><button id="frameTile" title="Toggle tiled layout">Tile</button><button id="frameBlink" title="Blink file frames">Blink</button></div>
<div class="grid-controls"><label>Columns <input id="frameColumns" type="number" min="1" max="16" value="0" placeholder="Auto"></label><label>Rows <input id="frameRows" type="number" min="1" max="16" value="0" placeholder="Auto"></label></div>
<div id="frameItems" class="frame-items" aria-label="Drag to reorder frames"></div>
<div class="lock-controls"><button id="lockAll" title="Lock all parameters">All lock</button><button id="unlockAllFrames" title="Unlock all parameters">Unlock</button><label><input type="checkbox" data-side-lock="bc">B&amp;C</label><label><input type="checkbox" data-side-lock="color">LUT</label><label><input type="checkbox" data-side-lock="view">View</label><label><input type="checkbox" data-side-lock="scale">Zoom</label><label><input type="checkbox" data-side-lock="slice">Slice</label></div>
</div></div></details>
<details id="adjustModule" class="side-module" open><summary>ADJUST</summary><div class="side-module-body adjust-grid">
<label>Auto <select id="adjustCuts"><option value="percentile">ImageJ 99%</option><option value="zscale">DS9 ZScale</option><option value="p90">DS9 90%</option><option value="p95">DS9 95%</option><option value="p99">DS9 99%</option><option value="p999">DS9 99.9%</option><option value="minmax">Min / Max</option><option value="manual">Manual</option></select></label>
<label>Min <input id="adjustLow" type="number" step="any"></label><label>Max <input id="adjustHigh" type="number" step="any"></label>
<label>Stretch <select id="adjustStretch"><option>linear</option><option>log</option><option>sqrt</option><option>asinh</option><option>histeq</option><option>power</option><option>squared</option><option>sinh</option></select></label>
<label>LUT <select id="adjustLut"></select></label>
<div class="adjust-options"><label><input id="adjustInvert" type="checkbox">Invert</label><label><input id="adjustThreshold" type="checkbox">Threshold</label></div>
<div class="adjust-actions"><button id="adjustAuto">Auto</button><button id="adjustReset">Reset</button><button id="adjustApply">Apply</button></div>
</div></details>
<div id="contextMenu" class="context-menu" role="menu" hidden></div>
<div id="sortMenu" class="context-menu" role="menu" hidden></div>
<script nonce="{{nonce}}" src="{{script}}"></script></body></html>
